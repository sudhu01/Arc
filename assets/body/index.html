<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arc body</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* Transparent, so that until the canvas has painted anything the Flutter
       background behind this view shows through — which is the same colour the
       canvas is about to clear to. A fixed colour here is a flash of the wrong
       theme across a boot that can take several seconds.

       The figure itself does not rely on this: the canvas is opaque (`alpha`
       is off) and clears to the field colour, so the light theme still has
       something solid to multiply its ink into. */
    background: transparent;
    /* Vertical panning belongs to the sheet behind this view, not the canvas. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  /* Sized in CSS as well as by the renderer, so the element can never lay out
     at its device-pixel buffer size. */
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<script type="module" src="body.js"></script>
</body>
</html>
